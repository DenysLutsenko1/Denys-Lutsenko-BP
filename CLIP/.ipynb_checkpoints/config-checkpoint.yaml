random_seed: 42

encoder:                    # текстовый энкодер
  name: openai/clip-vit-base-patch32
  max_length: 77
  batch_size: 64
  device: auto
# intfloat/multilingual-e5-small
image_encoder:              # визуальный энкодер
  name: openai/clip-vit-base-patch32
  batch_size: 32
  device: auto

train:
  clf_type: mlp        # можно оставить logistic
  lr: 0.0001
  epochs: 20
  weight_decay: 0.05
  patience: 3
  log_interval: 50

paths:
  train: "../data/train.jsonl"
  val:   "../data/val.jsonl"
  test:  "../data/test.jsonl"
  outdir: outputs

features:
  normalize: true
  pool: mean

multimodal:
  use_similarity: true      # добавляет cos-сходство text↔image как фичу
  fuse: concat
  # use_similarity: false 
  
