random_seed: 42

blip2:
  # Оставляем оригинальное имя, оно используется для загрузки процессора и весов ViT
  name: "Salesforce/blip2-opt-2.7b"
  # Рекомендую снизить до 4, так как SBERT + BLIP-2 в FP16 могут не влезть в 8 ГБ при батче 8
  batch_size: 4 
  # Оставляем GPU 1, как у вас и было настроено
  device: "cuda:0"

train:
  clf_type: "mlp"
  lr: 0.0005
  epochs: 100
  patience: 15

paths:
  train: "../data/train.jsonl"
  val:   "../data/val.jsonl"
  test:  "../data/test.jsonl"
  outdir: "outputs"