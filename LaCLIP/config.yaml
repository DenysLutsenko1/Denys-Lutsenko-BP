random_seed: 42

encoder:                    # текстовый энкодер
  name: openai/clip-vit-base-patch32
  max_length: 256
  batch_size: 64
  device: auto

image_encoder:              # визуальный энкодер
  name: openai/clip-vit-base-patch32
  batch_size: 32
  device: auto

train:
  clf_type: mlp        # можно оставить logistic
  lr: 1e-3
  epochs: 20
  weight_decay: 0.0
  patience: 3
  log_interval: 50

paths:
  train: "../data/latrain.jsonl"
  val:   "../data/laval.jsonl"
  test:  "../data/latest.jsonl"
  outdir: outputs

features:
  normalize: true
  pool: mean

multimodal:
  use_similarity: true      # добавляет cos-сходство text↔image как фичу
  fuse: concat
